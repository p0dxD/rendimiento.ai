apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: rendimiento
    rendimiento.ai/app: secplus
  name: secplus
spec: {}
status: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/managed-by: rendimiento
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: secplus
    rendimiento.ai/app: secplus
    rendimiento.ai/service: worker
  name: worker-data
  namespace: secplus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: rendimiento
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: secplus
    rendimiento.ai/app: secplus
    rendimiento.ai/service: web
  name: web
  namespace: secplus
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      rendimiento.ai/app: secplus
      rendimiento.ai/service: web
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: rendimiento
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: secplus
        rendimiento.ai/app: secplus
        rendimiento.ai/service: web
    spec:
      containers:
      - env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: production
        - name: PRACTICE_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: secplus-practice
              optional: true
        envFrom:
        - secretRef:
            name: secplus-practice
            optional: true
        image: registry.example.lan:5000/secplus-web@sha256:aaaa
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        name: web
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /private
          name: secret-0
          readOnly: true
      volumes:
      - name: secret-0
        secret:
          optional: true
          secretName: secplus-practice
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: rendimiento
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: secplus
    rendimiento.ai/app: secplus
    rendimiento.ai/service: worker
  name: worker
  namespace: secplus
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      rendimiento.ai/app: secplus
      rendimiento.ai/service: worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: rendimiento
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: secplus
        rendimiento.ai/app: secplus
        rendimiento.ai/service: worker
    spec:
      containers:
      - env:
        - name: PORT
          value: "8080"
        image: registry.example.lan:5000/secplus-worker@sha256:bbbb
        imagePullPolicy: IfNotPresent
        name: worker
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 2
          tcpSocket:
            port: http
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 1001
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: worker-data
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: rendimiento
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: secplus
    rendimiento.ai/app: secplus
    rendimiento.ai/service: web
  name: web
  namespace: secplus
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 3000
  - name: app
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    rendimiento.ai/app: secplus
    rendimiento.ai/service: web
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: rendimiento
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: secplus
    rendimiento.ai/app: secplus
    rendimiento.ai/service: worker
  name: worker
  namespace: secplus
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: app
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    rendimiento.ai/app: secplus
    rendimiento.ai/service: worker
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app.kubernetes.io/managed-by: rendimiento
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: secplus
    rendimiento.ai/app: secplus
    rendimiento.ai/service: web
  name: web
  namespace: secplus
spec:
  ingressClassName: nginx
  rules:
  - host: secplus.joserod.space
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - secplus.joserod.space
    secretName: secplus-tls
status:
  loadBalancer: {}
