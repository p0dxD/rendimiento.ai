# rendimiento builds itself. Every push to main rebuilds its book (docs,
# public in English and Spanish, and on the home network) and tests and builds its own image (builds:
# platform), so a change is checked on the cluster like any app's. The
# image is kept with the release; it is not deployed from here yet.
services:
  - name: docs
    path: .
    build:
      builder: dockerfile
      dockerfile: docs/Dockerfile
    port: 8080
    size: small
    replicas: 1
    health: { path: / }
    # The public book; aprende. opens the Spanish edition (docs/nginx.conf).
    domain: learn.rendimiento.ai
    aliases: [aprende.rendimiento.ai]
    # A LAN address from MetalLB's pool (any free one): the home-network
    # edition of the book, with private pages, is served from main_configs.
    lan: {}
    catalog:
      category: devtools
      title: rendimiento book
      description: How rendimiento works, how it is deployed here, and how to change it.
builds:
  # rendimiento's own image: the Go tests (envtest and a throwaway Postgres)
  # first, then the Dockerfile, which also checks the UI.
  - name: platform
    path: .
    build: { dockerfile: Dockerfile }
    test:
      image: golang:1.27
      command: CHECK_GENERATED=1 hack/ci-test.sh
      postgres: true
      cache: true
      # Two envtest API servers run at once (hack/ci-test.sh): with less
      # than two cores, etcd times out.
      resources: { cpu: "2", memory: 2Gi, memoryLimit: 5Gi }
tasks:
  # The "rendimiento for …" libraries (sdk/): each is tested on every run
  # that changes its folder, branches included.
  - name: sdk-node
    path: sdk/node
    when: always
    image: node:20-bookworm
    command: npm ci --no-audit --no-fund && npm test
  - name: sdk-python
    path: sdk/python
    when: always
    image: python:3.12-slim
    command: pip install --quiet --no-cache-dir '.[test]' && python -m pytest -q tests
  - name: sdk-java
    path: sdk/java
    when: always
    image: maven:3.9-eclipse-temurin-21
    command: mvn -B -q verify
