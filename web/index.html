<html lang="en">

    <script>
      // The day/night theme and movement chosen in the top bar, applied
      // before the first paint so the page never flashes the other theme.
      try {
        var t = localStorage.getItem("rendimiento.tema");
        if (t === "day" || t === "night") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("rendimiento.movimiento") === "off") document.documentElement.dataset.motion = "off";
      } catch (e) {}
    </script>
    <title>rendimiento.ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
