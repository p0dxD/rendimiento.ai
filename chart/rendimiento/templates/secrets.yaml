{{- if .Values.postgres.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: rendimiento-db
  labels:
    {{- include "rendimiento.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "rendimiento.keep" (dict "ns" .Release.Namespace "name" "rendimiento-db" "key" "password") }}
---
{{- end }}
# The setup page asks for this token before it makes the GitHub App:
#   kubectl -n {{ .Release.Namespace }} get secret rendimiento-setup -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: rendimiento-setup
  labels:
    {{- include "rendimiento.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "rendimiento.keep" (dict "ns" .Release.Namespace "name" "rendimiento-setup" "key" "token") }}
