      - Big picture: architecture/overview.md
      - Flows, step by step: architecture/flows.md
      - The CI engine: architecture/pipeline.md
      - Building images with BuildKit: architecture/builds.md
      - The app controller: architecture/controller.md
      - The add-on engine: architecture/addons.md
      - API, auth and the UI: architecture/api-ui.md
      - Data and state: architecture/data.md
      - Security model: architecture/security.md
  - Using it:
      - guide/index.md
      - rendimiento.yaml reference: guide/spec.md
      - Apps day to day: guide/apps.md
      - Builds and tests: guide/builds.md
      - Tasks (commands in CI): guide/tasks.md
      - Reliability (uptime and charts): guide/reliability.md
      - Visits (Umami): guide/visits.md
      - Notifications (email): guide/notifications.md
      - Problems (what went wrong in the platform): guide/problems.md
      - La Ruta (memory for people and agents, over MCP): guide/ruta.md
      - Languages (English, Spanish): guide/languages.md
      - Needs and the services catalog: guide/needs.md
      - Add-ons: guide/addons.md
      - Renovate: guide/renovate.md
  - Developing it:
      - develop/index.md
      - Go for this codebase: develop/go.md
      - Setting up and building: develop/setup.md
      - Recipes for common changes: develop/recipes.md
      - Testing: develop/testing.md
      - Design patterns: develop/patterns.md
      - Refactoring and code health: develop/refactoring.md
  - Growing it:
      - future/index.md
      - Scaling: future/scaling.md
      - Roadmap: future/roadmap.md
      - Becoming an open-source project: future/open-source.md
  - Reference:
      - reference/index.md
      - Configuration: reference/config.md
      - HTTP API: reference/api.md
      - Custom resources: reference/crds.md
      - Make targets and scripts: reference/tooling.md
      - Code map: reference/code-map.md
