# The book's web server. nginx listens on 8080 inside the pod, but people reach
# it on port 80 (or 443 through a proxy), so redirects must not name a host or
# port: "/es" → "/es/" stays relative instead of becoming http://host:8080/es/.

# The Spanish name of the book's address (aprende.<domain>) opens the
# Spanish edition; any other host opens the English one.
map $host $edicion {
    ~*^aprende\.  /es/;
    default       "";
}

server {
    listen       8080;
    server_name  localhost;
    absolute_redirect off;
    root   /usr/share/nginx/html;
    index  index.html;
    error_page 404 /404.html;
    location = / {
        if ($edicion) {
            return 302 $edicion;
        }
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
